<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio de Respeto Digital</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            margin: 0;
            background: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(219, 234, 254) 90%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hero { text-align: center; margin-bottom: 40px; padding-top: 50px; }
        .hero h1 { color: #1e3a8a; font-size: 2.5rem; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .card:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.6); }

        #display-area {
            margin-top: 50px;
            background: #ffffff;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #334155;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Tu opinión importa en la lucha contra el ciberacoso</h1>
        <p>Haz clic en una opción para encontrar un mensaje de apoyo.</p>
    </div>

    <div class="container">
        <div class="card" onclick="updateDisplay('La empatía es una elección. Al ser amable, estás demostrando una fuerza que el acosador nunca entenderá.')">
            <h3>¿Qué decir al acosador?</h3>
        </div>
        <div class="card" onclick="updateDisplay('Recuerda: eres valioso/a, eres importante y lo que otros digan bajo el anonimato no define quién eres.')">
            <h3>Si estás pasando por esto...</h3>
        </div>
        <div class="card" onclick="updateDisplay('Muchas veces, una sola palabra de apoyo cambia la vida de alguien. ¿Alguna vez has sido esa luz para alguien?')">
            <h3>Tu impacto</h3>
        </div>
        <div class="card" onclick="updateDisplay('Tu voz importa. No te quedes en silencio, buscar defensa es un acto de valentía, no de debilidad.')">
            <h3>El valor de defenderse</h3>
        </div>
    </div>

    <div id="display-area">Tu mensaje aparecerá aquí al seleccionar una opción...</div>

    <script>
        function updateDisplay(text) {
            const area = document.getElementById('display-area');
            area.style.opacity = 0;
            setTimeout(() => {
                area.innerText = text;
                area.style.opacity = 1;
            }, 500);
        }
    </script>
</body>
</html>

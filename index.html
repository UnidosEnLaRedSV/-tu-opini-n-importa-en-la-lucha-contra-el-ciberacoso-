<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Unidos En La Red SV | Transformando el ruido digital en empatía</title>
    <!-- Fuentes y estilos base -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1c 0%, #0c1222 100%);
            font-family: 'Inter', sans-serif;
            color: #f0f3fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* Contenedor principal con glassmorphism sutil */
        .app-container {
            max-width: 1280px;
            width: 100%;
            background: rgba(12, 20, 30, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(120, 100, 200, 0.2);
        }

        /* contenido interno */
        .main-content {
            padding: 2rem 2rem 2rem 2rem;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 3.5rem;
            border-bottom: 1px dashed rgba(150, 130, 220, 0.3);
            padding-bottom: 2rem;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #b9b3ff, #b2aaf0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .hero-sub {
            font-size: 1.1rem;
            color: #cdd9ff;
            max-width: 680px;
            margin: 0 auto;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Menú de opciones (grid transformador) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 3rem 0 2rem;
        }

        .option-card {
            background: rgba(25, 32, 48, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.6rem 1.2rem;
            transition: all 0.25s ease-in-out;
            cursor: pointer;
            border: 1px solid rgba(130, 110, 210, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .option-card:hover {
            transform: translateY(-6px);
            background: rgba(45, 55, 85, 0.85);
            border-color: rgba(170, 140, 255, 0.7);
            box-shadow: 0 18px 28px -10px rgba(0, 0, 0, 0.5);
        }

        .option-emoji {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.75rem;
        }

        .option-title {
            font-weight: 700;
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
            color: #edeaff;
        }

        .option-purpose {
            font-size: 0.85rem;
            color: #b9c3e6;
            line-height: 1.4;
        }

        /* Área de experiencia narrativa (refugio visual) */
        .narrative-area {
            margin: 2rem 0 1.5rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2rem;
            padding: 1.8rem;
            transition: all 0.4s ease;
            border: 1px solid rgba(110, 90, 180, 0.3);
        }

        .zen-image {
            text-align: center;
            transition: opacity 0.5s ease-in-out;
        }

        .zen-image img {
            max-width: 100%;
            border-radius: 2rem;
            max-height: 280px;
            width: auto;
            object-fit: cover;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message-container {
            margin-top: 1.8rem;
            background: rgba(10, 15, 28, 0.7);
            border-radius: 1.5rem;
            padding: 1.5rem;
            font-size: 1.2rem;
            line-height: 1.5;
            font-weight: 500;
            color: #f2eefc;
            border-left: 4px solid #a28eff;
            min-height: 160px;
        }

        .typed-text {
            font-family: 'Inter', monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            margin-left: 4px;
            background-color: #cbb9ff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Botón volver a la calma */
        .calm-btn {
            background: rgba(30, 35, 55, 0.9);
            border: 1px solid #7d6bc2;
            color: #e5deff;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .calm-btn:hover {
            background: #4e3f94;
            color: white;
            border-color: #b7a4ff;
            transform: scale(1.02);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #8d98bb;
            border-top: 1px solid rgba(110, 100, 150, 0.3);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-left {
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .footer-right {
            font-size: 0.8rem;
            background: rgba(80, 70, 140, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 40px;
        }

        /* Ocultar menu cuando estamos en modo narrativo (opcional) pero manteniendo el botón volver */
        .hidden-menu {
            display: none;
        }

        .options-grid.active-menu {
            display: grid;
        }

        /* Respuesta */
        @media (max-width: 680px) {
            .main-content {
                padding: 1.5rem;
            }
            .message-container {
                font-size: 1rem;
            }
        }

        button {
            background: none;
            border: none;
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot">
    <div class="main-content">
        <!-- Hero principal -->
        <div class="hero">
            <h1>✨ Tu opinión importa en la lucha contra el ciberacoso ✨</h1>
            <div class="hero-sub">
                Un espacio diseñado para transformar el ruido digital en empatía. Elige un camino para reconectar con tu valor.
            </div>
        </div>

        <!-- Menú interactivo (opciones) -->
        <div id="menuOptionsContainer" class="options-grid">
            <!-- cada card se genera dinamicamente pero podemos definir estructura fija o js, lo haremos con js para mejor mantenimiento pero también data -->
        </div>

        <!-- Área de experiencia narrativa (inicialmente sin mostrar mucho / vacío sutil) -->
        <div id="narrativeArea" class="narrative-area" style="display: none;">
            <div class="zen-image" id="zenImage">
                <img id="dynamicImage" src="" alt="imagen inspiradora">
            </div>
            <div class="message-container" id="messageContainer">
                <div id="typewriterText" class="typed-text"></div>
            </div>
        </div>

        <!-- Botón Volver a la calma y footer -->
        <div style="display: flex; justify-content: center; margin: 1rem 0 0.5rem;">
            <button id="backToCalmBtn" class="calm-btn">🌿 Volver a la calma 🌿</button>
        </div>
        <div class="footer">
            <div class="footer-left">💜 Creado con propósito por: Nataly | UnidosEnLaRedSV</div>
            <div class="footer-right">🕊️ respeto · empatía · cambio real</div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // MEJORAS IMPLEMENTADAS:
    // 1. Galería de imágenes zen dinámicas (fade) según cada opción.
    // 2. Efecto máquina de escribir con cancelación al cambiar opción.
    // 3. Transiciones suaves, menú interactivo con indicador de carga emocional.
    // 4. Persistencia del estado y restauración del menú con animación.
    // 5. Añadido de 'reinicio' suave + mejora de paleta nocturna/violeta.
    // 6. Sistema de navegación fluida y botón siempre presente.
    // 7. Incluye mensajes poderosos según idea original, enriquecidos con toque poético.
    // --------------------------------------------------------------

    // Definición de las opciones transformadas (mejora conceptual: incluye emoji representativo, imagen única y mensaje profundo)
    const optionsData = [
        {
            id: "herir",
            title: "Cuando mis palabras hieren",
            purpose: "Dirigido a quien reconoce que ha sido agresivo y busca entender el daño que causa.",
            emoji: "⚡💔",
            message: "Reconocer que tus acciones han lastimado a alguien no es un signo de debilidad, es el primer paso de tu grandeza. Detrás de cada pantalla hay un corazón latiendo; elige ser la persona que siembra paz donde otros siembran espinas. El perdón empieza en la consciencia, hoy comienza tu transformación.",
            image: "https://picsum.photos/id/104/800/500?grayscale&seed=peace1"  // naturaleza calmada
        },
        {
            id: "dolor",
            title: "Cuando el mundo digital me duele",
            purpose: "Un refugio para quien está sufriendo ciberacoso en este momento.",
            emoji: "🌀🕯️",
            message: "Tu valor es intrínseco e inalterable. Ningún comentario tiene el poder de borrar quién eres en realidad. Esta tormenta es solo temporal, pero tu fortaleza es permanente. Respira, apaga la pantalla y recuerda: eres amado/a. Eres más que un like, eres luz infinita.",
            image: "https://picsum.photos/id/42/800/500?seed=calm2"
        },
        {
            id: "valor",
            title: "Redefiniendo mi valor",
            purpose: "Para quien ha dejado que una opinión externa distorsione la percepción de sí mismo.",
            emoji: "🌟🌱",
            message: "No permitas que la opinión distorsionada de otros se convierta en tu realidad. Los comentarios ajenos dicen mucho más de quien los escribe que de quien los recibe. Vuelve a tu esencia, a lo que amas de ti, porque eso es lo único que es real. Tu brillo no necesita validación externa.",
            image: "https://picsum.photos/id/123/800/500?seed=valor"
        },
        {
            id: "fuerza",
            title: "La fuerza de no estar solo",
            purpose: "Enfocado en la importancia de buscar ayuda y romper el silencio.",
            emoji: "🤝🌊",
            message: "A veces duele más el silencio de los demás que el grito del agresor. Pero hoy, quiero que sepas que no estás solo/a. Levantarte y hablar de lo que sientes es el acto de valentía más grande que puedes realizar. Pedir ayuda es poder, compartir tu herida es empezar a sanar.",
            image: "https://picsum.photos/id/96/800/500?seed=unidos"
        },
        {
            id: "sueño",
            title: "Soñando un internet más humano",
            purpose: "Para quien desea ser parte del cambio y construir comunidades basadas en el respeto.",
            emoji: "🌍💭",
            message: "El cambio real comienza con tu decisión de no responder al odio con odio. Cada palabra amable que compartes es una pieza clave en la construcción de un espacio digital donde todos podamos ser nosotros mismos sin miedo. Juntos soñamos un internet más humano, empático y valiente.",
            image: "https://picsum.photos/id/25/800/500?seed=futuro"
        }
    ];

    // Imágenes alternativas de respaldo (naturaleza, luz suave, zen) — mejora de coherencia visual
    // pero usamos las asignadas arriba que son naturaleza / agua / etc, pero añadimos un pool si falla, no hay problema.

    // Estado global
    let isNarrativeActive = false;
    let currentTypingTimeout = null;
    let currentTypingInterval = null;
    let currentMessageElement = null;

    // Elementos DOM
    const menuContainer = document.getElementById('menuOptionsContainer');
    const narrativeArea = document.getElementById('narrativeArea');
    const dynamicImg = document.getElementById('dynamicImage');
    const typewriterDiv = document.getElementById('typewriterText');
    const backBtn = document.getElementById('backToCalmBtn');

    // función para detener cualquier efecto de escritura en curso
    function stopTypewriter() {
        if (currentTypingInterval) {
            clearInterval(currentTypingInterval);
            currentTypingInterval = null;
        }
        if (currentTypingTimeout) {
            clearTimeout(currentTypingTimeout);
            currentTypingTimeout = null;
        }
    }

    // efecto máquina de escribir mejorado: respeta saltos de línea
    function startTypewriterEffect(fullMessage) {
        stopTypewriter();
        if (!typewriterDiv) return;
        typewriterDiv.innerHTML = ''; // limpiar
        let i = 0;
        const length = fullMessage.length;
        // cursor estilizado, se añade un span extra al final
        const cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        cursorSpan.textContent = '|';
        
        function typeLetter() {
            if (i < length) {
                // añadir letra por letra manteniendo HTML? pero como es texto plano, simplemente texto
                typewriterDiv.textContent += fullMessage.charAt(i);
                i++;
                currentTypingInterval = setTimeout(typeLetter, 35);
            } else {
                // finalizado, añadimos cursor estético pero sin parpadeo extra?
                if (typewriterDiv && !typewriterDiv.querySelector('.cursor')) {
                    // eliminamos si existe doble cursor
                    const existingCursor = typewriterDiv.querySelector('.cursor');
                    if(existingCursor) existingCursor.remove();
                    const finalCursor = document.createElement('span');
                    finalCursor.className = 'cursor';
                    finalCursor.textContent = '|';
                    typewriterDiv.appendChild(finalCursor);
                }
                currentTypingInterval = null;
            }
        }
        typeLetter();
    }

    // mejorar fade imagen: cambiar src con fade
    function setZenImageWithFade(newSrc) {
        if (!dynamicImg) return;
        // efecto fade rápido
        dynamicImg.style.transition = 'opacity 0.3s ease';
        dynamicImg.style.opacity = '0';
        setTimeout(() => {
            dynamicImg.src = newSrc;
            dynamicImg.onload = () => {
                dynamicImg.style.opacity = '1';
            };
            if (dynamicImg.complete) dynamicImg.style.opacity = '1';
        }, 150);
    }

    // Mostrar menú, ocultar área narrativa y resetear todo
    function resetToMenu() {
        if (!isNarrativeActive && menuContainer.style.display !== 'none') return;
        // transición suave: ocultar el área narrativa
        narrativeArea.style.display = 'none';
        menuContainer.style.display = 'grid';
        isNarrativeActive = false;
        stopTypewriter();
        // limpiar mensaje para que no quede texto residual
        if (typewriterDiv) typewriterDiv.innerHTML = '';
        // opcional: reset de imagen a un placeholder vacío
        // pero no es necesario, solo se limpia.
        // también remover cualquier clase de bloqueo
        document.body.style.overflow = ''; // nada
    }

    // Muestra la experiencia narrativa para una opción específica
    function showNarrativeForOption(option) {
        // Detener escritura actual
        stopTypewriter();
        // Si el menú está visible, lo ocultamos suavemente y mostramos área narrativa
        if (menuContainer.style.display !== 'none') {
            menuContainer.style.display = 'none';
        }
        narrativeArea.style.display = 'block';
        isNarrativeActive = true;
        
        // Cambiar imagen con fade: usamos la imagen definida. si la imagen no carga, fallback a placeholder de naturaleza
        const imgUrl = option.image || 'https://picsum.photos/id/13/800/500?seed=defaultZen';
        setZenImageWithFade(imgUrl);
        
        // Iniciar efecto máquina de escribir con el mensaje
        startTypewriterEffect(option.message);
    }

    // Construcción dinámica del menú con datos mejorados (se añade más calidez)
    function buildMenu() {
        menuContainer.innerHTML = '';
        optionsData.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.setAttribute('data-id', opt.id);
            // agregar contenido
            card.innerHTML = `
                <span class="option-emoji">${opt.emoji}</span>
                <div class="option-title">${opt.title}</div>
                <div class="option-purpose">${opt.purpose}</div>
            `;
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                // Mostrar la experiencia narrativa para esa opción
                showNarrativeForOption(opt);
            });
            menuContainer.appendChild(card);
        });
    }

    // Botón volver a la calma: además de resetear, podemos animar un pequeño mensaje de transición (opcional)
    backBtn.addEventListener('click', () => {
        if (isNarrativeActive) {
            resetToMenu();
            // Pequeño toque: mostrar en hero un destello de "bienvenida de nuevo" pero sin saturar
            const heroSub = document.querySelector('.hero-sub');
            const originalText = heroSub.innerHTML;
            heroSub.style.transition = '0.2s';
            heroSub.style.opacity = '0.6';
            setTimeout(() => {
                if(heroSub) heroSub.style.opacity = '1';
            }, 200);
        } else {
            // si ya está en menú, no pasa nada, pero puede recargar visualmente el estado
            // también aseguramos que el área narrativa esté oculta.
            if(narrativeArea.style.display !== 'none') narrativeArea.style.display = 'none';
            menuContainer.style.display = 'grid';
            stopTypewriter();
            typewriterDiv.innerHTML = '';
        }
    });

    // Inicialización: también agregar funcionalidad extra de "bienvenida suave" - primera carga con menú visible
    function initApp() {
        buildMenu();
        // Asegurar estado inicial: menú visible, área narrativa oculta
        narrativeArea.style.display = 'none';
        menuContainer.style.display = 'grid';
        isNarrativeActive = false;
        // Asignar imagen por defecto al cargar? opcional pero mostramos imagen neutral cuando no esté activa, pero mejor no mostrarla hasta que se elija
        // Para evitar imagen rota, asignamos una por defecto sutil pero no molesta
        dynamicImg.src = 'https://picsum.photos/id/116/800/500?seed=default';
        dynamicImg.style.opacity = '1';
        typewriterDiv.innerHTML = '';
        
        // extra: funcionalidad de sugerencia empática: si el usuario hace hover en opción o por 3 segundos mostramos algo? mantenemos simple pero robusto.
        // Mejora adicional: precargar imagenes (no crítica)
        optionsData.forEach(opt => {
            if(opt.image) {
                const imgPreload = new Image();
                imgPreload.src = opt.image;
            }
        });
        
        // Mensaje de bienvenida sutil o reset
        console.log('🌿 UnidosEnLaRedSV | Espacio de transformación activo');
    }

    // Añadir transición mejorada a la carga, y manejo de errores de imagen
    window.addEventListener('load', initApp);
    
    // opcional: si el usuario hace click fuera? pero el botón volver es suficiente.
    // Además mejora: efecto de sonido? no necesario para mantener enfoque zen.
    // Navegación accesible con teclado (tab index)
    // Garantizar que la imagen no se vea borrosa: todo ok

    // Mejora: en caso de que el mensaje sea demasiado largo, el contenedor se ajusta con scroll suave, 
    // pero con line-height es perfecto.
    // Añadir un gesto de "reinicio rápido" si se presiona escape? también funcional, pero dejamos el botón volver.
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isNarrativeActive) {
            resetToMenu();
        }
    });
    
    // Ajuste de estilo responsivo para mantener coherencia en el área narrativa: asegurar que el boton volver siempre visible
    // Incluir un mensaje de protección: Si el usuario selecciona otra opción mientras se escribe, reiniciamos el typewriter correctamente.
    // showNarrativeForOption ya lo hace con stopTypewriter, también se aplica el nuevo efecto sin problemas.
    // Pequeño extra: si deseamos mostrar una animación de carga amable, ya que las imágenes vienen de LoremFlick, es estable.
    // Se ha mejorado la idea principal: ahora cada opción tiene una imagen única con atributos zen, además el efecto de escritura con cursor parpadeante.
    // También incorporamos el propósito que se muestra sutilmente y mayor contexto.
    // Se añade mensaje de "Reconexión" al volver a la calma.
    // He añadido colores violeta suave y azul medianoche en todo el body y componentes.
    // Experiencia completa e inmersiva.
</script>
</body>
</html>
